# .github/workflows/consensus-loop.yml
name: Peer-to-Peer Consensus Loop (7 Rounds)

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'The task for the agents'
        required: true
        default: 'Find and fix the most critical bug in the Dex-tool project.'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache models and llama.cpp
        uses: actions/cache@v4
        with: { path: "models/\nllama.cpp/", key: "${{ runner.os }}-models-llama-v1" }
      - name: Download if cache miss
        run: |
          if [ ! -d "llama.cpp" ]; then
            mkdir -p models
            curl -L -o models/qwen.gguf "https://huggingface.co/DuoNeural/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf"
            curl -L -o models/glm.gguf "https://huggingface.co/axteam/GLM-4-9B-0414-GGUF/resolve/main/GLM-4-9B-0414-Q4_K_M.gguf"
            git clone https://github.com/ggerganov/llama.cpp
            cd llama.cpp && make
          fi
      - uses: actions/upload-artifact@v4
        with: { name: setup-artifacts, path: "models/\nllama.cpp/", retention-days: 1 }

  round1:
    needs: setup
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 1

  round2:
    needs: round1
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 2
      # مقادیر زیر به صورت خودکار از round1 پاس داده می‌شن
      # (در فایل reusable workflow با needs.previous تعریف شده)

  round3:
    needs: round2
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 3

  round4:
    needs: round3
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 4

  round5:
    needs: round4
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 5

  round6:
    needs: round5
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 6

  round7:
    needs: round6
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 7
