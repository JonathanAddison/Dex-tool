# .github/workflows/consensus-loop.yml
name: Peer-to-Peer Consensus Loop (7 Rounds)

on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'The task for the agents'
        required: true
        default: 'Find and fix the most critical bug in the Dex-tool project.'

jobs:
  round1:
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 1
      qwen_prev: ""
      glm_prev: ""

  round2:
    needs: round1
    if: needs.round1.outputs.qwen_consensus != 'true' || needs.round1.outputs.glm_consensus != 'true'
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 2
      qwen_prev: ${{ needs.round1.outputs.qwen_output }}
      glm_prev: ${{ needs.round1.outputs.glm_output }}

  round3:
    needs: round2
    if: needs.round2.outputs.qwen_consensus != 'true' || needs.round2.outputs.glm_consensus != 'true'
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 3
      qwen_prev: ${{ needs.round2.outputs.qwen_output }}
      glm_prev: ${{ needs.round2.outputs.glm_output }}

  round4:
    needs: round3
    if: needs.round3.outputs.qwen_consensus != 'true' || needs.round3.outputs.glm_consensus != 'true'
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 4
      qwen_prev: ${{ needs.round3.outputs.qwen_output }}
      glm_prev: ${{ needs.round3.outputs.glm_output }}

  round5:
    needs: round4
    if: needs.round4.outputs.qwen_consensus != 'true' || needs.round4.outputs.glm_consensus != 'true'
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 5
      qwen_prev: ${{ needs.round4.outputs.qwen_output }}
      glm_prev: ${{ needs.round4.outputs.glm_output }}

  round6:
    needs: round5
    if: needs.round5.outputs.qwen_consensus != 'true' || needs.round5.outputs.glm_consensus != 'true'
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 6
      qwen_prev: ${{ needs.round5.outputs.qwen_output }}
      glm_prev: ${{ needs.round5.outputs.glm_output }}

  round7:
    needs: round6
    if: needs.round6.outputs.qwen_consensus != 'true' || needs.round6.outputs.glm_consensus != 'true'
    uses: ./.github/workflows/peer-round.yml
    with:
      task_prompt: ${{ github.event.inputs.task_prompt }}
      round_number: 7
      qwen_prev: ${{ needs.round6.outputs.qwen_output }}
      glm_prev: ${{ needs.round6.outputs.glm_output }}
