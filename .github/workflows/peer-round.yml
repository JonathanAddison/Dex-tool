# .github/workflows/peer-round.yml
name: Peer Consensus Round

on:
  workflow_call:
    inputs:
      task_prompt:
        required: true
        type: string
      round_number:
        required: true
        type: number
      qwen_prev:
        required: false
        type: string
        default: ""
      glm_prev:
        required: false
        type: string
        default: ""
    outputs:
      qwen_output:
        value: ${{ jobs.run-qwen.outputs.agent_output }}
      glm_output:
        value: ${{ jobs.run-glm.outputs.agent_output }}
      qwen_consensus:
        value: ${{ jobs.run-qwen.outputs.consensus_flag }}
      glm_consensus:
        value: ${{ jobs.run-glm.outputs.consensus_flag }}

jobs:
  run-qwen:
    runs-on: ubuntu-latest
    outputs:
      agent_output: ${{ steps.run.outputs.agent_output }}
      consensus_flag: ${{ steps.run.outputs.consensus_flag }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore models and llama.cpp binary
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            models/
            llama.cpp/
          key: Linux-models-llama-v3

      - name: Download Qwen + prebuilt llama.cpp (if cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models llama.cpp/build/bin
          curl -L --retry 3 -o models/qwen.gguf \
            "https://huggingface.co/DuoNeural/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf"
          wget -q https://github.com/ggml-org/llama.cpp/releases/download/b12230/llama-b12230-bin-ubuntu-x64.tar.gz
          tar -xzf llama-b12230-bin-ubuntu-x64.tar.gz -C llama.cpp/build/bin --strip-components=1
          rm llama-b12230-bin-ubuntu-x64.tar.gz
          chmod +x llama.cpp/build/bin/llama-completion

      - name: Gather project source code
        run: |
          : > /tmp/code_context.txt
          total=0
          find . -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.h" -o -name "*.hpp" -o -name "*.js" -o -name "*.py" -o -name "*.json" \) \
            -not -path "./llama.cpp/*" -not -path "./models/*" -not -path "./.git/*" \
            -not -path "./scripts/*" -not -path "./results/*" \
            | sort > /tmp/filelist.txt
          echo "=== FILES IN REPO ===" >> /tmp/code_context.txt
          cat /tmp/filelist.txt >> /tmp/code_context.txt
          echo "" >> /tmp/code_context.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ $((total + size)) -lt 18000 ]; then
              echo "=== FILE: $f ===" >> /tmp/code_context.txt
              cat "$f" >> /tmp/code_context.txt
              echo "" >> /tmp/code_context.txt
              total=$((total + size))
            else
              echo "(... file skipped: size budget exceeded ...)" >> /tmp/code_context.txt
              break
            fi
          done < /tmp/filelist.txt
          echo "Code context size: $(wc -c < /tmp/code_context.txt) bytes"

      - name: Run Qwen
        id: run
        env:
          MODEL_PATH: models/qwen.gguf
          AGENT_NAME: qwen
          ROUND: ${{ inputs.round_number }}
          TASK_PROMPT: ${{ inputs.task_prompt }}
          MY_LAST_OUTPUT: ${{ inputs.qwen_prev }}
          PEER_LAST_OUTPUT: ${{ inputs.glm_prev }}
          OUTPUT_FILE: results/qwen_round${{ inputs.round_number }}.json
          CODE_CONTEXT_FILE: /tmp/code_context.txt
        run: |
          python scripts/peer_consensus.py
          echo "agent_output<<EOF" >> $GITHUB_OUTPUT
          jq -r '.output' $OUTPUT_FILE >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "consensus_flag=$(jq -r '.consensus' $OUTPUT_FILE)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: round${{ inputs.round_number }}-qwen
          path: results/

  run-glm:
    runs-on: ubuntu-latest
    outputs:
      agent_output: ${{ steps.run.outputs.agent_output }}
      consensus_flag: ${{ steps.run.outputs.consensus_flag }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore models and llama.cpp binary
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            models/
            llama.cpp/
          key: Linux-models-llama-v3

      - name: Download GLM + prebuilt llama.cpp (if cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models llama.cpp/build/bin
          curl -L --retry 3 -o models/glm.gguf \
            "https://huggingface.co/axteam/GLM-4-9B-0414-GGUF/resolve/main/GLM-4-9B-0414-Q3_K_M.gguf"
          wget -q https://github.com/ggml-org/llama.cpp/releases/download/b12230/llama-b12230-bin-ubuntu-x64.tar.gz
          tar -xzf llama-b12230-bin-ubuntu-x64.tar.gz -C llama.cpp/build/bin --strip-components=1
          rm llama-b12230-bin-ubuntu-x64.tar.gz
          chmod +x llama.cpp/build/bin/llama-completion

      - name: Gather project source code
        run: |
          : > /tmp/code_context.txt
          total=0
          find . -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.h" -o -name "*.hpp" -o -name "*.js" -o -name "*.py" -o -name "*.json" \) \
            -not -path "./llama.cpp/*" -not -path "./models/*" -not -path "./.git/*" \
            -not -path "./scripts/*" -not -path "./results/*" \
            | sort > /tmp/filelist.txt
          echo "=== FILES IN REPO ===" >> /tmp/code_context.txt
          cat /tmp/filelist.txt >> /tmp/code_context.txt
          echo "" >> /tmp/code_context.txt
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ $((total + size)) -lt 18000 ]; then
              echo "=== FILE: $f ===" >> /tmp/code_context.txt
              cat "$f" >> /tmp/code_context.txt
              echo "" >> /tmp/code_context.txt
              total=$((total + size))
            else
              echo "(... file skipped: size budget exceeded ...)" >> /tmp/code_context.txt
              break
            fi
          done < /tmp/filelist.txt
          echo "Code context size: $(wc -c < /tmp/code_context.txt) bytes"

      - name: Run GLM
        id: run
        env:
          MODEL_PATH: models/glm.gguf
          AGENT_NAME: glm
          ROUND: ${{ inputs.round_number }}
          TASK_PROMPT: ${{ inputs.task_prompt }}
          MY_LAST_OUTPUT: ${{ inputs.glm_prev }}
          PEER_LAST_OUTPUT: ${{ inputs.qwen_prev }}
          OUTPUT_FILE: results/glm_round${{ inputs.round_number }}.json
          CODE_CONTEXT_FILE: /tmp/code_context.txt
        run: |
          python scripts/peer_consensus.py
          echo "agent_output<<EOF" >> $GITHUB_OUTPUT
          jq -r '.output' $OUTPUT_FILE >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "consensus_flag=$(jq -r '.consensus' $OUTPUT_FILE)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: round${{ inputs.round_number }}-glm
          path: results/
