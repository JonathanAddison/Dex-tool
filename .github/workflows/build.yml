name: Build Dex-tool

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: "${{ github.workspace }}/android-sdk"
      # r36 fix: GitHub runners preset ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
      # (the runner's own preinstalled SDK). With only ANDROID_HOME set, Gradle
      # sees two different SDK paths and aborts with "Several environment
      # variables and/or system properties contain different paths to the SDK".
      # Aligning it with our manually-installed SDK removes the conflict.
      ANDROID_SDK_ROOT: "${{ github.workspace }}/android-sdk"
      ANDROID_NDK_ROOT: "${{ github.workspace }}/android-sdk/ndk/25.2.9519653"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3-pip unzip curl \
            build-essential lib32stdc++6 lib32z1 flex bison

      - name: Setup Android SDK manually
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-26" \
            "platforms;android-34" \
            "build-tools;35.0.1" \
            "ndk;25.2.9519653"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools"           >> "$GITHUB_PATH"

      - name: Install Gradle 8.5
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.5-bin.zip" \
            -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Install meson
        run: pip3 install meson

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000 2>/dev/null || true
          fi

      # ---- dependencies (cached) -------------------------------------

      - name: Cache frida-gum arm64-v8a
        id: cache-frida-arm64
        uses: actions/cache@v4
        with:
          path: deps/frida-gum/arm64-v8a
          key: frida-gum-16.7.19-arm64-v3

      - name: Build frida-gum 16.7.19 arm64-v8a
        if: "${{ steps.cache-frida-arm64.outputs.cache-hit != 'true' }}"
        run: |
          git clone --recurse-submodules --depth 1 --branch 16.7.19 \
            https://github.com/frida/frida-gum.git frida-gum-src
          cd frida-gum-src
          FRIDA_PFX="$GITHUB_WORKSPACE/frida-dist-arm64"
          mkdir -p "$FRIDA_PFX"
          ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
          ./configure --host=android-arm64 --prefix="$FRIDA_PFX" \
            -- -Dgumjs=enabled -Dv8=disabled -Ddatabase=disabled \
               -Dtests=disabled -Dgraft_tool=disabled -Ddevkits=gumjs
          make -j"$(nproc)"
          make install || true
          mkdir -p "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a"
          GUMLIB="$(find . "$FRIDA_PFX" -name 'libfrida-gumjs.a' 2>/dev/null | head -1)"
          GUMHDR="$(find . "$FRIDA_PFX" -name 'frida-gumjs.h'   2>/dev/null | head -1)"
          [ -z "$GUMLIB" ] && { echo "ERROR: libfrida-gumjs.a not found"; exit 1; }
          [ -z "$GUMHDR" ] && { echo "ERROR: frida-gumjs.h not found";   exit 1; }
          cp "$GUMLIB" "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a/libfrida-gumjs.a"
          cp "$GUMHDR" "$GITHUB_WORKSPACE/deps/frida-gum/arm64-v8a/frida-gumjs.h"

      - name: Cache frida-gum armeabi-v7a
        id: cache-frida-arm
        uses: actions/cache@v4
        with:
          path: deps/frida-gum/armeabi-v7a
          key: frida-gum-16.7.19-armeabi-v7a-v3

      - name: Build frida-gum 16.7.19 armeabi-v7a
        if: "${{ steps.cache-frida-arm.outputs.cache-hit != 'true' }}"
        run: |
          if [ ! -d frida-gum-src ]; then
            git clone --recurse-submodules --depth 1 --branch 16.7.19 \
              https://github.com/frida/frida-gum.git frida-gum-src
          fi
          cd frida-gum-src
          rm -rf build
          FRIDA_PFX="$GITHUB_WORKSPACE/frida-dist-arm"
          mkdir -p "$FRIDA_PFX"
          ANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
          ./configure --host=android-arm --prefix="$FRIDA_PFX" \
            -- -Dgumjs=enabled -Dv8=disabled -Ddatabase=disabled \
               -Dtests=disabled -Dgraft_tool=disabled -Ddevkits=gumjs
          make -j"$(nproc)"
          make install || true
          mkdir -p "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a"
          GUMLIB="$(find . "$FRIDA_PFX" -name 'libfrida-gumjs.a' 2>/dev/null | head -1)"
          GUMHDR="$(find . "$FRIDA_PFX" -name 'frida-gumjs.h'   2>/dev/null | head -1)"
          [ -z "$GUMLIB" ] && { echo "ERROR: armeabi-v7a lib not found"; exit 1; }
          cp "$GUMLIB" "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a/libfrida-gumjs.a"
          cp "$GUMHDR" "$GITHUB_WORKSPACE/deps/frida-gum/armeabi-v7a/frida-gumjs.h"

      - name: Cache Dobby
        id: cache-dobby
        uses: actions/cache@v4
        with:
          path: deps/dobby
          key: dobby-lsposed-v3-pinned

      - name: Build Dobby for both ABIs
        if: "${{ steps.cache-dobby.outputs.cache-hit != 'true' }}"
        run: |
          git clone https://github.com/LSPosed/Dobby.git dobby-src
          git -C dobby-src checkout c1da0315d7a2069bde2ab432e45d4ab6df91237a
          mkdir -p deps/dobby
          cp -r dobby-src/include deps/dobby/
          for ABI in arm64-v8a armeabi-v7a; do
            cmake -S dobby-src -B "dobby-src/build-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release -DDOBBY_DEBUG=OFF \
              -DDOBBY_GENERATE_SHARED=OFF -GNinja
            ninja -C "dobby-src/build-$ABI" -j"$(nproc)" dobby
            mkdir -p "deps/dobby/$ABI"
            cp "dobby-src/build-$ABI/libdobby.a" "deps/dobby/$ABI/"
          done

      - name: Clone ImGui 1.93.0-docking
        run: |
          git clone --depth 1 --branch v1.93.0-docking \
            https://github.com/ocornut/imgui.git imgui
          ls imgui/backends/imgui_impl_opengl3.cpp
          # r36: stock ImGui - the ForgetDeviceObjects patch the old
          # workflow appended here was dead code (declared in
          # overlay.cpp, never called; imgui_park_without_gl handles
          # context loss without GL calls).

      - name: Build smali 3.0.7 dex jar
        run: |
          mkdir -p deps/smali/jars
          BASE="https://dl.google.com/dl/android/maven2/com/android/tools/smali"
          SMVER="3.0.7"
          for art in smali smali-dexlib2 smali-util; do
            wget -q "$BASE/$art/$SMVER/$art-$SMVER.jar" -O "deps/smali/jars/$art.jar"
          done
          wget -q "https://repo1.maven.org/maven2/com/beust/jcommander/1.72/jcommander-1.72.jar" \
            -O deps/smali/jars/jcommander.jar
          wget -q "https://repo1.maven.org/maven2/com/google/guava/guava/30.1.1-android/guava-30.1.1-android.jar" \
            -O deps/smali/jars/guava.jar
          wget -q "https://repo1.maven.org/maven2/org/antlr/antlr-runtime/3.5.2/antlr-runtime-3.5.2.jar" \
            -O deps/smali/jars/antlr-runtime.jar
          B2VER="2.5.2"
          for art in baksmali dexlib2 util; do
            wget -q "https://repo1.maven.org/maven2/org/smali/$art/$B2VER/$art-$B2VER.jar" \
              -O "deps/smali/jars/orgsmali-$art.jar"
          done
          D8="$ANDROID_HOME/build-tools/35.0.1/d8"
          if "$D8" --release --min-api 26 \
               --lib "$ANDROID_HOME/platforms/android-34/android.jar" \
               --output deps/smali/smali-fat.jar deps/smali/jars/*.jar; then
            unzip -l deps/smali/smali-fat.jar | grep -E "classes[0-9]*\.dex" || true
          else
            echo "::warning::d8 failed - falling back to the plain JVM jar; Smali hooks cannot load it on-device"
            MERGE="$(mktemp -d)"
            for j in deps/smali/jars/*.jar; do unzip -qn "$j" -d "$MERGE" 2>/dev/null || true; done
            jar cf deps/smali/smali-fat.jar -C "$MERGE" .
          fi
          ls -lh deps/smali/smali-fat.jar

      # ---- build ------------------------------------------------------

      - name: Embed agent.js as C array
        run: |
          mkdir -p src out/lib/arm64-v8a out/lib/armeabi-v7a
          cat > /tmp/gen_embed.js << 'DXTNJS'
          const fs    = require('fs');
          const data  = fs.readFileSync('agent/agent.js');
          const bytes = Array.from(data);
          let out = '// Auto-generated from agent/agent.js\n';
          out += '#pragma once\n#include <stddef.h>\n\n';
          out += 'static const char g_agent_js[] = {\n';
          let line = '';
          for (let i = 0; i < bytes.length; i++) {
              line += '0x' + bytes[i].toString(16).padStart(2,'0') + ',';
              if ((i+1)%16===0) { out += '    '+line+'\n'; line=''; }
          }
          if (line) out += '    '+line+'\n';
          out += '    0x00\n};\n';
          out += 'static const size_t g_agent_js_size = '+bytes.length+';\n';
          fs.writeFileSync('src/agent_bundle_embed.h', out);
          console.log('agent_bundle_embed.h: '+bytes.length+' bytes');
          DXTNJS
          node /tmp/gen_embed.js

      - name: Build libtool.so arm64-v8a
        run: |
          cmake -S . -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -GNinja
          ninja -C build-arm64 -j"$(nproc)" tool
          STRIP="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-unneeded build-arm64/libtool.so \
                   -o out/lib/arm64-v8a/libtool.so
          echo "arm64: $(du -sh out/lib/arm64-v8a/libtool.so)"

      - name: Build libtool.so armeabi-v7a
        run: |
          cmake -S . -B build-arm \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -GNinja
          ninja -C build-arm -j"$(nproc)" tool
          STRIP="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" --strip-unneeded build-arm/libtool.so \
                   -o out/lib/armeabi-v7a/libtool.so
          echo "armeabi-v7a: $(du -sh out/lib/armeabi-v7a/libtool.so)"

      - name: Build sample-signed.apk (with libtool.so)
        run: |
          mkdir -p sample-app/app/src/main/jniLibs/arm64-v8a \
                   sample-app/app/src/main/jniLibs/armeabi-v7a \
                   sample-app/app/src/main/assets
          # r36 fix: same SDK as the env vars (the env alignment alone would
          # do; this pins it for the gradle daemon that ignores env changes)
          echo "sdk.dir=$ANDROID_HOME" > sample-app/local.properties
          cp out/lib/arm64-v8a/libtool.so \
             sample-app/app/src/main/jniLibs/arm64-v8a/libtool.so
          cp out/lib/armeabi-v7a/libtool.so \
             sample-app/app/src/main/jniLibs/armeabi-v7a/libtool.so
          cp deps/smali/smali-fat.jar \
             sample-app/app/src/main/assets/smali-fat.jar
          cd sample-app
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/sample-signed.apk"
          echo "sample-signed.apk: $(du -sh "$GITHUB_WORKSPACE/sample-signed.apk")"

      - name: Build sample-nolib-signed.apk (without libtool.so)
        run: |
          rm -rf /tmp/nolib-app
          cp -r sample-app /tmp/nolib-app
          rm -f /tmp/nolib-app/app/src/main/jniLibs/arm64-v8a/libtool.so
          rm -f /tmp/nolib-app/app/src/main/jniLibs/armeabi-v7a/libtool.so
          sed -i -e 's/System\.loadLibrary("tool");//' \
                 -e 's/Log.i(TAG, "libtool.so loaded");//' \
            /tmp/nolib-app/app/src/main/java/com/dextool/app/DexToolApp.java
          cd /tmp/nolib-app
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/sample-nolib-signed.apk"
          echo "nolib: $(du -sh "$GITHUB_WORKSPACE/sample-nolib-signed.apk")"

      - name: Upload libtool.so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libtool-so-both-abis
          path: |
            out/lib/arm64-v8a/libtool.so
            out/lib/armeabi-v7a/libtool.so

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sample-apks
          path: |
            sample-signed.apk
            sample-nolib-signed.apk
