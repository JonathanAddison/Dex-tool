          # ---- agent_server.py ----
          open('agent_server.py', 'w', encoding='utf-8').write('''import json, os, re, subprocess
import requests
from flask import Flask, request, Response, stream_with_context, jsonify, send_from_directory
from flask_cors import CORS
from tool_registry import ToolRegistry
from builtin_tools import register_builtin

app = Flask(__name__, static_folder='.', static_url_path='')
CORS(app, resources={r"/*": {"origins": "*", "methods": ["GET","POST","OPTIONS"]}})

LLAMA_URL = "http://127.0.0.1:8080/v1/chat/completions"
REPO_ROOT = os.getcwd()

reg = ToolRegistry(REPO_ROOT, max_native=16)
register_builtin(reg, REPO_ROOT)
reg.load_all_skills(os.path.join(REPO_ROOT, "skills"))
reg.load_all_plugins(os.path.join(REPO_ROOT, "plugins"))

SYSTEM_PROMPT = """You are a Claude-level autonomous agent with 35+ tools organized into skills.
Use list_skills() then load_skill(name) to activate specialized tools.

RULES:
1. NEVER ask for permission. Investigate autonomously.
2. Start broad: list_files(), git_log(), glob_search().
3. Load specialized skills if needed.
4. Cite exact paths and line numbers.
5. Respond in Persian when user uses Persian."""

def _sandbox_prefix():
    try:
        if subprocess.run(["which","bwrap"], capture_output=True).returncode != 0: return None
        test = subprocess.run(["bwrap","--ro-bind","/","/","--","true"], capture_output=True, timeout=5)
        if test.returncode != 0: return None
    except: return None
    return ["bwrap","--unshare-all","--die-with-parent",
            "--ro-bind","/usr","/usr","--ro-bind","/lib","/lib",
            "--ro-bind","/lib64","/lib64","--ro-bind","/bin","/bin",
            "--proc","/proc","--dev","/dev",
            "--bind",REPO_ROOT,REPO_ROOT,"--chdir",REPO_ROOT]

@app.route("/")
@app.route("/index.html")
def index():
    try:
        return send_from_directory(REPO_ROOT, "index.html")
    except:
        return jsonify({"info":"No index.html found. Use POST /v1/chat/completions"}), 200

@app.route("/health", methods=["GET"])
def health():
    return jsonify({"status":"ok","tools":len(reg.tools),"skills":list(reg.skills),"plugins":list(reg.plugins),"active_skill":reg.active_skill,"native_slots":reg.max_native,"sandbox":bool(_sandbox_prefix())})

@app.route("/v1/chat/completions", methods=["GET", "POST", "OPTIONS"])
def proxy_chat():
    if request.method == "OPTIONS":
        return ("", 204)
    if request.method == "GET":
        return jsonify({"info":"POST /v1/chat/completions with JSON body"}), 200

    data = request.json or {}
    messages = data.get("messages", [])
    if not any(m.get("role") == "system" for m in messages):
        messages.insert(0, {"role":"system","content":SYSTEM_PROMPT})

    def sse(o):
        return "data: " + json.dumps(o, ensure_ascii=False) + "\\n\\n"

    def generate():
        try:
            for _ in range(15):
                schemas = reg.get_active_schemas()
                skill_p = reg.get_skill_prompt()
                cur = list(messages)
                if skill_p and not any(m.get("content") == skill_p for m in cur if m.get("role")=="system"):
                    cur.insert(1, {"role":"system","content":skill_p})
                payload = {"model":"ministral","messages":cur,"tools":schemas,"tool_choice":"auto","stream":False,"temperature":0.1,"max_tokens":4096}
                r = requests.post(LLAMA_URL, json=payload, timeout=600)
                r.raise_for_status()
                msg = r.json()["choices"][0]["message"]
                raw = msg.get("content","") or ""
                th = re.search(r'\\[THINK\\](.*?)\\[/THINK\\]', raw, re.DOTALL)
                if th:
                    yield sse({"choices":[{"delta":{"reasoning_content": th.group(1).strip()}}]})
                tcs = msg.get("tool_calls")
                if not tcs:
                    final = re.sub(r'\\[THINK\\].*?\\[/THINK\\]', '', raw, flags=re.DOTALL).strip()
                    if final:
                        yield sse({"choices":[{"delta":{"content":final}}]})
                    yield sse({"choices":[{"delta":{},"finish_reason":"stop"}]})
                    yield "data: [DONE]\\n\\n"
                    return
                messages.append({"role":"assistant","content":raw,"tool_calls":tcs})
                for tc in tcs:
                    fn = tc["function"]["name"]
                    try: args = json.loads(tc["function"].get("arguments","{}"))
                    except: args = {}
                    yield sse({"choices":[{"delta":{"tool_call":{"name":fn,"arguments":args}}}]})
                    out = reg.execute(fn, args)
                    messages.append({"role":"tool","tool_call_id":tc["id"],"content":out[:10000]})
            yield sse({"choices":[{"delta":{"content":"max 15 steps reached."}}]})
            yield sse({"choices":[{"delta":{},"finish_reason":"stop"}]})
            yield "data: [DONE]\\n\\n"
        except Exception as e:
            yield sse({"choices":[{"delta":{"content":"error: " + str(e)}}]})
            yield "data: [DONE]\\n\\n"

    return Response(stream_with_context(generate()), mimetype="text/event-stream",
                    headers={"Cache-Control":"no-cache","X-Accel-Buffering":"no"})

if __name__ == "__main__":
    app.run(host="0.0.0.0", port=5000, threaded=True)
''')

