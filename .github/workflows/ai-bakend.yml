def _run(cmd, timeout=60, cwd=None):
    try:
        r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout, cwd=cwd)
        return (r.stdout + r.stderr).strip()[:6000] or "(no output)"
    except subprocess.TimeoutExpired: return "timeout after " + str(timeout) + "s"
    except Exception as e: return "error: " + str(e)

def _safe(root, p):
    if not p: return root
    full = os.path.realpath(os.path.join(root, p))
    return full if full.startswith(root) else None

def register_builtin(reg, R):
    def list_files(a):
        full = _safe(R, a.get("path", ""))
        if not full or not os.path.isdir(full): return "invalid path"
        items = [e + ("/" if os.path.isdir(os.path.join(full,e)) else "") for e in sorted(os.listdir(full)) if not e.startswith(".git")]
        return "\\n".join(items[:150]) or "(empty)"

    def read_file(a):
        full = _safe(R, a.get("path"))
        if not full or not os.path.isfile(full): return "file not found"
        lines = open(full, encoding="utf-8", errors="ignore").read().splitlines()
        off = max(0, a.get("offset", 1) - 1)
        lim = a.get("limit") or 400
        return "\\n".join("{:>5}| {}".format(off+i+1, l) for i,l in enumerate(lines[off:off+lim]))[:15000]

    def write_file(a):
        full = _safe(R, a.get("path"))
        if not full: return "invalid path"
        if os.path.dirname(full): os.makedirs(os.path.dirname(full), exist_ok=True)
        open(full, "w", encoding="utf-8").write(a.get("content",""))
        return "wrote: " + a.get("path", "")

    def edit_file(a):
        full = _safe(R, a.get("path"))
        if not full or not os.path.isfile(full): return "file not found"
        c = open(full, encoding="utf-8", errors="ignore").read()
        old, new = a.get("old_string",""), a.get("new_string","")
        if c.count(old) != 1: return "old_string must be unique (count={})".format(c.count(old))
        open(full, "w", encoding="utf-8").write(c.replace(old, new, 1))
        return "edited: " + a.get("path", "")

    def append_file(a):
        full = _safe(R, a.get("path"))
        if not full: return "invalid path"
        open(full, "a", encoding="utf-8").write(a.get("content",""))
        return "appended"

    def delete_file(a):
        full = _safe(R, a.get("path"))
        if not full or not os.path.isfile(full): return "file not found"
        os.remove(full); return "deleted"

    def move_file(a):
        s, d = _safe(R, a.get("src")), _safe(R, a.get("dst"))
        if not s or not d: return "invalid path"
        shutil.move(s, d); return "moved"

    def copy_file(a):
        s, d = _safe(R, a.get("src")), _safe(R, a.get("dst"))
        if not s or not d: return "invalid path"
        shutil.copy2(s, d); return "copied"

    def file_info(a):
        full = _safe(R, a.get("path"))
        if not full or not os.path.exists(full): return "not found"
        st = os.stat(full)
        return json.dumps({"size": st.st_size, "is_dir": os.path.isdir(full)})

    def create_directory(a):
        full = _safe(R, a.get("path"))
        if not full: return "invalid path"
        os.makedirs(full, exist_ok=True); return "created"

    def glob_search(a):
        base = _safe(R, a.get("path", "")) or R
        files = glob.glob(os.path.join(base, a.get("pattern","")), recursive=True)
        return "\\n".join(os.path.relpath(f, R) for f in files if os.path.isfile(f))[:6000] or "no matches"

    def search_code(a):
        return _run(["grep","-rIn","-E",a.get("query",""),a.get("path",".")], 20, R)[:6000]

    def find_symbol(a):
        pat = "\\\\b" + re.escape(a.get("symbol","")) + "\\\\b"
        return _run(["grep","-rIn","-E",pat,a.get("path",".")], 20, R)[:6000]

    def git_log(a): return _run(["git","log","-" + str(a.get("limit",10)),"--oneline"], 10, R)
    def git_diff(a): return _run(["git","diff","HEAD~1","--",a.get("path","")], 10, R)[:5000]
    def git_show(a): return _run(["git","show","--stat",a.get("commit","")], 10, R)[:5000]
    def git_blame(a): return _run(["git","blame",a.get("path","")], 15, R)[:5000]
    def git_status(a): return _run(["git","status"], 10, R)
    def git_branch(a): return _run(["git","branch","-a"], 10, R)

    def bash_execute(a): return _run(["sh","-c",a.get("command","")], a.get("timeout",60), R)
    def python_execute(a): return _run(["python3","-c",a.get("code","")], a.get("timeout",60), R)

    def binary_strings(a): return _run(["strings","-n",str(a.get("min_len",4)),a.get("path","")], 20, R)[:6000]
    def binary_symbols(a): return _run(["nm","-C","--defined-only",a.get("path","")], 20, R)[:6000]
    def binary_headers(a): return _run(["readelf","-h",a.get("path","")], 20, R)[:6000]
    def binary_sections(a): return _run(["readelf","-S",a.get("path","")], 20, R)[:6000]
    def binary_disassemble(a): return _run(["objdump","-d",a.get("path","")], 30, R)[:6000]
    def binary_hexdump(a): return _run(["xxd","-l",str(a.get("length",256)),a.get("path","")], 10, R)

    def hash_file(a):
        full = _safe(R, a.get("path"))
        if not full: return "invalid path"
        h = hashlib.new(a.get("algo","sha256")); h.update(open(full,"rb").read())
        return h.hexdigest()

    def base64_encode(a): return base64.b64encode(a.get("text","").encode()).decode()
    def base64_decode(a): return base64.b64decode(a.get("text","")).decode(errors="ignore")

    def sqlite_query(a):
        full = _safe(R, a.get("path"))
        if not full: return "invalid path"
        return _run(["sqlite3",full,a.get("query","")], 20, R)[:6000]

    def list_skills(a): return "\\n".join("- " + k for k in reg.skills) or "no skills"
    def load_skill(a):
        return "skill activated: " + a.get("name","") if reg.activate_skill(a.get("name","")) else "skill not found"
    def unload_skill(a): reg.deactivate_skill(); return "skill deactivated"
    def list_plugins(a): return "\\n".join("- " + k for k in reg.plugins) or "no plugins"

    defs = [
        ("list_files","List directory contents.",{"path":{"type":"string"}},[],list_files,True),
        ("read_file","Read file with line numbers.",{"path":{"type":"string"},"offset":{"type":"integer"},"limit":{"type":"integer"}},["path"],read_file,True),
        ("write_file","Write file (overwrite).",{"path":{"type":"string"},"content":{"type":"string"}},["path","content"],write_file,False),
        ("edit_file","Exact string replacement (must be unique).",{"path":{"type":"string"},"old_string":{"type":"string"},"new_string":{"type":"string"}},["path","old_string","new_string"],edit_file,True),
        ("append_file","Append to file.",{"path":{"type":"string"},"content":{"type":"string"}},["path","content"],append_file,False),
        ("delete_file","Delete file.",{"path":{"type":"string"}},["path"],delete_file,False),
        ("move_file","Move/rename file.",{"src":{"type":"string"},"dst":{"type":"string"}},["src","dst"],move_file,False),
        ("copy_file","Copy file.",{"src":{"type":"string"},"dst":{"type":"string"}},["src","dst"],copy_file,False),
        ("file_info","File metadata.",{"path":{"type":"string"}},["path"],file_info,False),
        ("create_directory","Create directory.",{"path":{"type":"string"}},["path"],create_directory,False),
        ("glob_search","Find files by glob pattern.",{"pattern":{"type":"string"},"path":{"type":"string"}},["pattern"],glob_search,True),
        ("search_code","Search code with regex.",{"query":{"type":"string"},"path":{"type":"string"}},["query"],search_code,True),
        ("find_symbol","Find symbol references.",{"symbol":{"type":"string"},"path":{"type":"string"}},["symbol"],find_symbol,False),
        ("git_log","Git commit history.",{"limit":{"type":"integer"}},["limit"],git_log,True),
        ("git_diff","Git diff vs HEAD~1.",{"path":{"type":"string"}},["path"],git_diff,False),
        ("git_show","Show commit.",{"commit":{"type":"string"}},["commit"],git_show,False),
        ("git_blame","Git blame.",{"path":{"type":"string"}},["path"],git_blame,False),
        ("git_status","Git status.",{},[],git_status,False),
        ("git_branch","List branches.",{},[],git_branch,False),
        ("bash_execute","Run shell in sandbox.",{"command":{"type":"string"},"timeout":{"type":"integer"}},["command"],bash_execute,True),
        ("python_execute","Run Python in sandbox.",{"code":{"type":"string"},"timeout":{"type":"integer"}},["code"],python_execute,True),
        ("binary_strings","Extract strings.",{"path":{"type":"string"},"min_len":{"type":"integer"}},["path"],binary_strings,False),
        ("binary_symbols","List binary symbols.",{"path":{"type":"string"}},["path"],binary_symbols,False),
        ("binary_headers","ELF headers.",{"path":{"type":"string"}},["path"],binary_headers,False),
        ("binary_sections","ELF sections.",{"path":{"type":"string"}},["path"],binary_sections,False),
        ("binary_disassemble","Disassemble.",{"path":{"type":"string"}},["path"],binary_disassemble,False),
        ("binary_hexdump","Hex dump.",{"path":{"type":"string"},"length":{"type":"integer"}},["path"],binary_hexdump,False),
        ("hash_file","File hash.",{"path":{"type":"string"},"algo":{"type":"string"}},["path"],hash_file,False),
        ("base64_encode","Base64 encode.",{"text":{"type":"string"}},["text"],base64_encode,False),
        ("base64_decode","Base64 decode.",{"text":{"type":"string"}},["text"],base64_decode,False),
        ("sqlite_query","SQLite query.",{"path":{"type":"string"},"query":{"type":"string"}},["path","query"],sqlite_query,False),
        ("list_skills","List available skills.",{},[],list_skills,True),
        ("load_skill","Activate a skill.",{"name":{"type":"string"}},["name"],load_skill,True),
        ("unload_skill","Deactivate current skill.",{},[],unload_skill,False),
        ("list_plugins","List loaded plugins.",{},[],list_plugins,False),
    ]
    for name, desc, props, req, func, base in defs:
        schema = {"type":"function","function":{"name":name,"description":desc,"parameters":{"type":"object","properties":props,"required":req}}}
        reg.register_tool(schema, func, base=base)
