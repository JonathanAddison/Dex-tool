name: AI Backend with Tools

on:
  workflow_dispatch:
  push:
    branches: [ dev ]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install flask requests

      - name: Install huggingface-cli & download model
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash -s
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          hf download mistralai/Ministral-3-14B-Reasoning-2512-GGUF --include "*Q4_K_M.gguf" --local-dir ./model

      - name: Download llama.cpp server
        run: |
          wget https://github.com/ggml-org/llama.cpp/releases/download/b12230/llama-b12230-bin-ubuntu-x64.tar.gz
          mkdir -p llama-bin && tar -xzf llama-b12230-bin-ubuntu-x64.tar.gz -C llama-bin --strip-components=1

      - name: Start llama-server with --jinja
        run: |
          MODEL_FILE=$(find ./model -name "*.gguf" | head -n 1)
          ./llama-bin/llama-server -m "$MODEL_FILE" --host 127.0.0.1 --port 8080 --ctx-size 8192 --jinja &
          sleep 15

      - name: Start Agent Proxy
        run: |
          nohup python agent_server.py > agent.log 2>&1 &
          sleep 5

      - name: Expose via tunnel
        run: |
          npm install -g localtunnel
          lt --port 5000 --print-requests > tunnel.log 2>&1 &
          sleep 5
          TUNNEL_URL=$(grep -o 'https://[^ ]*' tunnel.log | head -n 1)
          echo "🌐 API URL: $TUNNEL_URL"
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

      - name: Keep alive
        run: sleep 14400
