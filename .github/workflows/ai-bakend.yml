name: AI Backend MAX (Claude-Level, Verified)

on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest   # 4 vCPU, 16GB RAM
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap binutils sqlite3 xxd

      # ✅ گزینه A (پیش‌فرض): فعال‌سازی bwrap با sysctl
      # گزینه B (امن‌تر): از Docker Sandbox استفاده کن (پایین‌تر توضیح داده شده)
      - name: Enable unprivileged user namespaces (Ubuntu 24.04 fix for bwrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Python deps
        run: pip install flask flask-cors requests waitress

      - name: Install HF CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash -s
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download Main Model (Ministral 14B Reasoning Q4_K_M)
        run: hf download mistralai/Ministral-3-14B-Reasoning-2512-GGUF --include "*Q4_K_M.gguf" --local-dir ./model

      # ✅ Draft Model با توکنایزر Tekken (همخانواده‌ی Ministral)
      - name: Download Draft Model (Mistral-Small-3.1-DRAFT-0.5B Q4_K_M)
        run: |
          hf download bartowski/alamios_Mistral-Small-3.1-DRAFT-0.5B-GGUF \
            --include "alamios_Mistral-Small-3.1-DRAFT-0.5B-Q4_K_M.gguf" \
            --local-dir ./draft

      # ✅ b12391: فیکس Tool Call داخل [THINK] برای Ministral
      - name: Download llama.cpp (b12391)
        run: |
          wget -q https://github.com/ggml-org/llama.cpp/releases/download/b12391/llama-b12391-bin-ubuntu-x64.tar.gz
          mkdir -p llama-bin
          tar -xzf llama-b12391-bin-ubuntu-x64.tar.gz -C llama-bin --strip-components=1

      - name: Start llama-server with Speculative Decoding
        run: |
          MAIN=$(find ./model -name "*.gguf" | head -n1)
          DRAFT=$(find ./draft -name "*.gguf" | head -n1)
          echo "Main:  $MAIN"
          echo "Draft: $DRAFT"

          nohup ./llama-bin/llama-server \
            -m "$MAIN" \
            --spec-draft-model "$DRAFT" \
            --spec-draft-n-max 5 \
            --spec-draft-n-min 2 \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 16384 \
            --n-predict 2048 \
            --jinja \
            --reasoning-format auto \
            -t 4 \
            -tb 4 \
            --parallel 1 \
            > llama.log 2>&1 &

          echo "⏳ Waiting for llama-server /health ..."
          for i in $(seq 1 120); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/health || true)
            if [ "$CODE" = "200" ]; then
              echo "✅ llama-server ready after $((i*5))s"
              break
            fi
            sleep 5
          done
          if ! curl -s http://127.0.0.1:8080/health >/dev/null; then
            echo "❌ llama-server failed to start"; tail -n 50 llama.log; exit 1
          fi
          tail -n 20 llama.log

      - name: Start Flask with waitress
        run: |
          nohup python -c "
           from waitress import serve
           from agent_server import app
           serve(app, host='0.0.0.0', port=5000, threads=8)
          " > agent.log 2>&1 &
          sleep 5
          curl -sf http://127.0.0.1:5000/health | tee /dev/stderr
          echo " ✅ Flask ready"

      - name: Expose via Cloudflare Quick Tunnel
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:5000 --no-autoupdate > tunnel.log 2>&1 &
          sleep 12
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n1)
          if [ -z "$URL" ]; then
            echo "❌ Tunnel URL not found"; cat tunnel.log; exit 1
          fi
          echo "🌐 TUNNEL URL: $URL"
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV

      - name: Keep alive
        run: |
          echo "🚀 API:  ${{ env.TUNNEL_URL }}"
          echo "📋 Health: ${{ env.TUNNEL_URL }}/health"
          sleep 3600
