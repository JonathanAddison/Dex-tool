      - name: Download llama.cpp (b12391)
        run: |
          wget -q https://github.com/ggml-org/llama.cpp/releases/download/b12391/llama-b12391-bin-ubuntu-x64.tar.gz
          mkdir -p llama-bin
          tar -xzf llama-b12391-bin-ubuntu-x64.tar.gz -C llama-bin --strip-components=1
          ls -la llama-bin/llama-server

      - name: Start llama-server
        run: |
          MAIN=$(find ./model -name "*.gguf" | head -n1)
          echo "Main model: $MAIN"
          nohup ./llama-bin/llama-server \
            -m "$MAIN" \
            --host 127.0.0.1 --port 8080 \
            --ctx-size 16384 --n-predict 2048 \
            --jinja --reasoning-format auto \
            -t 4 -tb 4 --parallel 1 \
            > llama.log 2>&1 &
          echo "waiting for llama-server..."
          for i in $(seq 1 120); do
            if curl -s http://127.0.0.1:8080/health >/dev/null 2>&1; then echo "ready after $((i*5))s"; break; fi
            sleep 5
          done
          if ! curl -s http://127.0.0.1:8080/health >/dev/null; then
            echo "llama-server failed"; tail -n 100 llama.log; exit 1
          fi
          tail -n 20 llama.log

      - name: Start Flask with waitress
        run: |
          nohup python -c "from waitress import serve; from agent_server import app; serve(app, host='0.0.0.0', port=5000, threads=8)" > agent.log 2>&1 &
          sleep 6
          echo "--- Local tests ---"
          curl -s http://127.0.0.1:5000/health && echo ""
          curl -s -o /dev/null -w "GET / => %{http_code}\n" http://127.0.0.1:5000/
          curl -s -o /dev/null -w "POST /v1/chat/completions => %{http_code}\n" -X POST http://127.0.0.1:5000/v1/chat/completions -H "Content-Type: application/json" -d '{"messages":[{"role":"user","content":"hi"}]}' || echo "POST test failed (check agent.log)"
          echo "--- If health returned tools count, everything is fine ---"
          if ! curl -s http://127.0.0.1:5000/health | grep -q '"status":"ok"'; then tail -n 50 agent.log; exit 1; fi

      - name: Expose via Cloudflare Tunnel
        run: |
          printf '' > /tmp/cf-empty.yml
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          nohup ./cloudflared --config /tmp/cf-empty.yml tunnel --protocol http2 --url http://localhost:5000 --no-autoupdate > tunnel.log 2>&1 &
          sleep 15
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' tunnel.log | head -n1)
          if [ -z "$URL" ]; then echo "tunnel URL not found"; cat tunnel.log; exit 1; fi
          echo "TUNNEL URL: $URL"
          echo "TUNNEL_URL=$URL" >> $GITHUB_ENV

      - name: Keep alive
        run: |
          echo "======================================"
          echo "API Endpoint: ${{ env.TUNNEL_URL }}"
          echo "Health check: ${{ env.TUNNEL_URL }}/health"
          echo "Chat:         ${{ env.TUNNEL_URL }}/v1/chat/completions"
          echo "======================================"
          sleep 3600
