<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dex-tool AI (Agent Mode)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0f0f0f; color: #ececec; height: 100vh; display: flex; flex-direction: column; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; margin: 0 auto; width: 100%; }
        .msg { display: flex; gap: 12px; align-items: flex-start; }
        .msg.user { flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .user .avatar { background: #10a37f; color: #fff; }
        .ai .avatar { background: #5436da; color: #fff; }
        .bubble { padding: 12px 16px; border-radius: 12px; max-width: 75%; line-height: 1.7; font-size: 15px; background: #1e1e1e; border: 1px solid #333; }
        .user .bubble { background: #10a37f; color: #fff; border-bottom-right-radius: 4px; }
        .ai .bubble { border-bottom-left-radius: 4px; }
        .think-box { background: #1a1a2e; border-right: 3px solid #5436da; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; color: #a0a0c0; font-style: italic; max-height: 150px; overflow-y: auto; }
        .tool-box { background: #1a2e1a; border-right: 3px solid #4ade80; padding: 6px 10px; border-radius: 6px; margin: 6px 0; font-size: 12px; color: #a0c0a0; direction: ltr; text-align: left; }
        .status-badge { font-size: 11px; color: #4ade80; margin-top: 4px; display: none; }
        #controls { max-width: 900px; margin: 0 auto; padding: 8px 20px; width: 100%; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        #controls label { font-size: 12px; color: #aaa; }
        #controls select, #controls input { background: #1e1e1e; border: 1px solid #333; color: #ccc; padding: 6px 10px; border-radius: 6px; font-size: 12px; }
        #input-area { padding: 16px 20px; border-top: 1px solid #2a2a2a; }
        #input-wrap { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; background: #1e1e1e; border-radius: 12px; padding: 8px; border: 1px solid #333; }
        #user-input { flex: 1; background: transparent; border: none; color: #ececec; font-size: 15px; resize: none; outline: none; padding: 8px; }
        #send-btn { background: #5436da; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        #send-btn:disabled { opacity: 0.5; }
        .error { color: #f87171; font-size: 13px; max-width: 900px; margin: 4px auto; }
        pre { background: #0d0d0d; padding: 12px; border-radius: 8px; overflow-x: auto; direction: ltr; text-align: left; margin: 8px 0; border: 1px solid #2a2a2a; }
    </style>
</head>
<body>
    <div id="chat"><div class="msg ai"><div class="avatar">🤖</div><div class="bubble">سلام داداش! حالا ابزار دارم و میتونم فایل‌های ریپو رو بخونم و توی کدها سرچ کنم. چیکار کنم؟</div></div></div>
    <div id="controls">
        <label>آدرس API:</label> <input type="text" id="api-url" placeholder="https://your-tunnel.loca.lt" style="flex:1; min-width:200px;">
        <label>عمق فکر:</label>
        <select id="reasoning-effort">
            <option value="low">کم (سریع)</option>
            <option value="medium" selected>متوسط</option>
            <option value="high">زیاد (دقیق)</option>
            <option value="xhigh">خیلی زیاد</option>
        </select>
    </div>
    <div id="input-area">
        <div id="input-wrap"><textarea id="user-input" rows="1" placeholder="سوالت رو بپرس..."></textarea><button id="send-btn" onclick="send()">ارسال</button></div>
        <div class="error" id="err"></div>
    </div>
    <script>
        const chat = document.getElementById('chat'), input = document.getElementById('user-input'), btn = document.getElementById('send-btn');
        const apiInput = document.getElementById('api-url'), effortSelect = document.getElementById('reasoning-effort');
        apiInput.value = localStorage.getItem('api_url') || '';
        apiInput.onchange = () => localStorage.setItem('api_url', apiInput.value.trim());
        input.onkeydown = e => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

        function addMsg(role, text) {
            const d = document.createElement('div'); d.className = `msg ${role}`;
            d.innerHTML = `<div class="avatar">${role==='user'?'👤':'🤖'}</div><div class="bubble">${role==='user'?text:''}</div>`;
            chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
            return d.querySelector('.bubble');
        }

        async function send() {
            const text = input.value.trim(), api = apiInput.value.trim();
            if(!text || !api) { document.getElementById('err').textContent = 'آدرس API و پیام لازمه.'; return; }
            document.getElementById('err').textContent = '';
            input.value = ''; btn.disabled = true;
            addMsg('user', text);
            const bubble = addMsg('ai', '');
            let fullContent = '', fullReasoning = '', toolHistory = [];

            // المان‌های داخل حباب
            const thinkDiv = document.createElement('div'); thinkDiv.className = 'think-box'; thinkDiv.style.display='none';
            const toolDiv = document.createElement('div'); toolDiv.className = 'tool-box'; toolDiv.style.display='none';
            const contentDiv = document.createElement('div');
            const statusDiv = document.createElement('div'); statusDiv.className = 'status-badge'; statusDiv.textContent = '✓ تمام شد';
            bubble.append(thinkDiv, toolDiv, contentDiv, statusDiv);

            try {
                const res = await fetch(`${api}/v1/chat/completions`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        messages: [{role:'system', content:'You are an expert reverse engineer. Use tools to read files and search code. Always read relevant files before answering.'}, {role:'user', content:text}],
                        reasoning_effort: effortSelect.value,
                        stream: true
                    })
                });
                if(!res.ok) throw new Error(`HTTP ${res.status}`);
                const reader = res.body.getReader(), dec = new TextDecoder();
                while(true) {
                    const {done, value} = await reader.read(); if(done) break;
                    for(const line of dec.decode(value, {stream:true}).split('\n').filter(l=>l.startsWith('data: '))) {
                        const data = line.slice(6).trim(); if(data==='[DONE]') continue;
                        try {
                            const json = JSON.parse(data), delta = json.choices?.[0]?.delta;
                            if(!delta) continue;
                            if(delta.reasoning_content) {
                                fullReasoning += delta.reasoning_content;
                                thinkDiv.style.display='block'; thinkDiv.textContent = fullReasoning;
                            }
                            // شبیه‌سازی نمایش ابزار (چون بک‌اند ما خودش ابزار رو اجرا می‌کنه، اینجا فقط برای نمایشه)
                            if(delta.content && delta.content.includes('read_file')) {
                                toolDiv.style.display='block'; toolDiv.textContent += '🔧 خواندن فایل...\n';
                            }
                            if(delta.content) {
                                fullContent += delta.content;
                                contentDiv.innerHTML = fullContent.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>').replace(/\n/g,'<br>');
                            }
                        } catch(e) {}
                    }
                }
                statusDiv.style.display = 'block';
            } catch(e) { contentDiv.innerHTML = `<span style="color:#f87171">خطا: ${e.message}</span>`; }
            finally { btn.disabled = false; input.focus(); }
        }
    </script>
</body>
</html>
