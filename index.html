<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dex-tool AI Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0f0f; color: #ececec; height: 100vh; display: flex; flex-direction: column; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; margin: 0 auto; width: 100%; }
        .message { display: flex; gap: 12px; align-items: flex-start; }
        .message.user { flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .user .avatar { background: #10a37f; color: #fff; }
        .ai .avatar { background: #5436da; color: #fff; }
        .bubble { padding: 12px 16px; border-radius: 12px; max-width: 75%; line-height: 1.7; font-size: 15px; }
        .user .bubble { background: #10a37f; color: #fff; border-bottom-right-radius: 4px; }
        .ai .bubble { background: #1e1e1e; color: #ececec; border-bottom-left-radius: 4px; border: 1px solid #333; }
        .bubble pre { background: #0d0d0d; padding: 12px; border-radius: 8px; overflow-x: auto; direction: ltr; text-align: left; margin: 8px 0; border: 1px solid #2a2a2a; }
        .bubble code { font-family: 'Courier New', monospace; font-size: 13px; color: #7ee787; }
        .thinking-box { background: #1a1a2e; border-left: 3px solid #5436da; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; color: #a0a0c0; font-style: italic; }
        .thinking-header { display: flex; align-items: center; gap: 8px; color: #7c7cff; font-weight: bold; margin-bottom: 4px; }
        .spinner { width: 14px; height: 14px; border: 2px solid #333; border-top-color: #7c7cff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .done-badge { color: #4ade80; font-size: 12px; }
        .tools-box { background: #1a2e1a; border-left: 3px solid #4ade80; padding: 8px 12px; border-radius: 8px; margin: 6px 0; font-size: 12px; color: #a0c0a0; direction: ltr; text-align: left; }
        #input-area { padding: 16px 20px; background: #0f0f0f; border-top: 1px solid #2a2a2a; }
        #input-wrapper { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; background: #1e1e1e; border-radius: 12px; padding: 8px; border: 1px solid #333; }
        #user-input { flex: 1; background: transparent; border: none; color: #ececec; font-size: 15px; resize: none; outline: none; padding: 8px; font-family: inherit; }
        #send-btn { background: #5436da; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: bold; }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #send-btn:hover:not(:disabled) { background: #6b4ce6; }
        .error { color: #f87171; font-size: 13px; margin-top: 8px; }
        #settings { max-width: 900px; margin: 0 auto; padding: 8px 20px; font-size: 12px; color: #666; }
        #settings input { background: #1e1e1e; border: 1px solid #333; color: #ccc; padding: 6px 10px; border-radius: 6px; width: 100%; font-size: 12px; direction: ltr; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div class="message ai">
            <div class="avatar">🤖</div>
            <div class="bubble">
                سلام داداش! من دستیار هوشمند <b>Dex-tool</b> هستم. کدهای ریپوت رو می‌بینم، باگ‌ها رو تحلیل می‌کنم و ایده می‌دم. چی رو بررسی کنم؟
            </div>
        </div>
    </div>
    <div id="settings">
        <label>آدرس API (از خروجی GitHub Actions کپی کن):</label>
        <input type="text" id="api-url" placeholder="https://your-tunnel-url.loca.lt" />
    </div>
    <div id="input-area">
        <div id="input-wrapper">
            <textarea id="user-input" rows="1" placeholder="سوالت رو بپرس... (Enter برای ارسال)"></textarea>
            <button id="send-btn" onclick="sendMessage()">ارسال</button>
        </div>
        <div class="error" id="error-msg"></div>
    </div>
    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const apiUrlInput = document.getElementById('api-url');
        const errorMsg = document.getElementById('error-msg');

        // ذخیره آدرس API در مرورگر
        apiUrlInput.value = localStorage.getItem('api_url') || '';
        apiUrlInput.addEventListener('change', () => localStorage.setItem('api_url', apiUrlInput.value.trim()));

        // ارسال با Enter (بدون Shift)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
                <div class="bubble">${role === 'ai' ? '' : text}</div>
            `;
            if (role === 'ai') { div.querySelector('.bubble').innerHTML = text; }
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div.querySelector('.bubble');
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiUrl = apiUrlInput.value.trim();
            if (!text || !apiUrl) {
                if (!apiUrl) errorMsg.textContent = 'لطفاً آدرس API رو وارد کن (از خروجی Actions).';
                return;
            }
            errorMsg.textContent = '';
            userInput.value = '';
            sendBtn.disabled = true;

            addMessage('user', text);
            const aiBubble = addMessage('ai', '<div class="thinking-box"><div class="thinking-header"><div class="spinner"></div> در حال فکر کردن...</div></div>');

            try {
                const response = await fetch(`${apiUrl}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "ministral",
                        messages: [
                            { role: "system", content: "You are an expert reverse engineer analyzing the Dex-tool repository. You have access to all files. Provide detailed analysis, bug reports, and code suggestions. Think step by step." },
                            { role: "user", content: text }
                        ],
                        stream: true,
                        temperature: 0.3,
                        max_tokens: 2048
                    })
                });

                if (!response.ok) throw new Error(`خطای HTTP: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';
                let fullReasoning = '';
                let toolCalls = [];

                aiBubble.innerHTML = ''; // پاک کردن حالت لودینگ

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n').filter(line => line.startsWith('data: '));
                    for (const line of lines) {
                        const data = line.replace('data: ', '').trim();
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices?.[0]?.delta;
                            if (!delta) continue;

                            // ۱. پردازش افکار مدل (reasoning)
                            if (delta.reasoning_content) {
                                fullReasoning += delta.reasoning_content;
                                let thinkingBox = aiBubble.querySelector('.thinking-box');
                                if (!thinkingBox) {
                                    thinkingBox = document.createElement('div');
                                    thinkingBox.className = 'thinking-box';
                                    thinkingBox.innerHTML = '<div class="thinking-header"><div class="spinner"></div> در حال فکر کردن...</div><div class="thinking-content"></div>';
                                    aiBubble.prepend(thinkingBox);
                                }
                                thinkingBox.querySelector('.thinking-content').textContent = fullReasoning;
                            }

                            // ۲. پردازش ابزارها (tool_calls)
                            if (delta.tool_calls) {
                                for (const tc of delta.tool_calls) {
                                    if (!toolCalls.some(t => t.id === tc.id)) {
                                        toolCalls.push(tc);
                                        const toolDiv = document.createElement('div');
                                        toolDiv.className = 'tools-box';
                                        toolDiv.innerHTML = `🔧 ابزار: <b>${tc.function?.name || 'در حال دریافت...'}</b>`;
                                        aiBubble.appendChild(toolDiv);
                                    }
                                }
                            }

                            // ۳. پردازش محتوای اصلی
                            if (delta.content) {
                                // وقتی محتوا شروع میشه، افکار رو جمع می‌کنیم
                                const thinkingBox = aiBubble.querySelector('.thinking-box');
                                if (thinkingBox && !thinkingBox.querySelector('.done-badge')) {
                                    thinkingBox.querySelector('.thinking-header').innerHTML = '✓ فکر کردن تمام شد';
                                    thinkingBox.querySelector('.thinking-header').classList.add('done-badge');
                                    const spinner = thinkingBox.querySelector('.spinner');
                                    if (spinner) spinner.remove();
                                }
                                fullContent += delta.content;
                                // رندر کردن محتوا (با پشتیبانی از کد)
                                let htmlContent = fullContent
                                    .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                                    .replace(/\n/g, '<br>');
                                aiBubble.innerHTML = (fullReasoning ? `<div class="thinking-box"><div class="thinking-header done-badge">✓ فکر کردن تمام شد</div><div class="thinking-content">${escapeHtml(fullReasoning)}</div></div>` : '') + htmlContent;
                            }
                        } catch (e) { console.warn('Parse error:', e); }
                    }
                }
            } catch (err) {
                aiBubble.innerHTML = `<span style="color:#f87171">خطا: ${err.message}</span>`;
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
