<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dex Agent — Claude-Level</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0;
         background: #0f1117; color: #e6e6e6; display: flex;
         flex-direction: column; height: 100vh; }
  header { padding: 12px 18px; background: #161b22;
           border-bottom: 1px solid #30363d; display: flex;
           align-items: center; gap: 10px; }
  header h1 { font-size: 16px; margin: 0; color: #58a6ff; }
  #status { font-size: 12px; color: #8b949e; }
  #chat { flex: 1; overflow-y: auto; padding: 18px;
          display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px;
         line-height: 1.6; font-size: 14px; white-space: pre-wrap;
         word-break: break-word; }
  .user { align-self: flex-end; background: #1f6feb; color: #fff; }
  .assistant { align-self: flex-start; background: #161b22;
               border: 1px solid #30363d; }
  .think { background: #1c1f26; border-right: 3px solid #d29922;
           color: #c9d1d9; font-size: 13px; font-style: italic;
           padding: 8px 12px; border-radius: 6px; margin-bottom: 8px;
           white-space: pre-wrap; }
  .tool { background: #0d1117; border: 1px dashed #484f58;
          color: #8b949e; font-size: 12px; font-family: monospace;
          padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; }
  #composer { display: flex; gap: 8px; padding: 12px 18px;
              background: #161b22; border-top: 1px solid #30363d; }
  #input { flex: 1; padding: 10px 14px; border-radius: 8px;
           border: 1px solid #30363d; background: #0d1117;
           color: #e6e6e6; font-family: inherit; font-size: 14px;
           resize: none; min-height: 44px; max-height: 120px; }
  button { padding: 10px 20px; border-radius: 8px; border: none;
           cursor: pointer; background: #238636; color: #fff;
           font-weight: 600; font-size: 14px; }
  button:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }
  button.stop { background: #da3633; }
</style>
</head>
<body>
<header>
  <h1>🤖 Dex Agent</h1>
  <span id="status">آماده</span>
</header>
<div id="chat"></div>
<div id="composer">
  <textarea id="input" placeholder="مثلاً: check repo و ساختار Dex را تحلیل کن..."></textarea>
  <button id="send">ارسال</button>
</div>
<script>
const API = window.location.origin + "/v1/chat/completions";
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");

let chatHistory = [];
let controller = null;
let busy = false;

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}
function addThink(text) {
  const div = document.createElement("div");
  div.className = "think";
  div.textContent = "💭 " + text;
  return div;
}
function addTool(name, args) {
  const div = document.createElement("div");
  div.className = "tool";
  div.textContent = "🔧 " + name + "(" + JSON.stringify(args) + ")";
  return div;
}
function setBusy(b) {
  busy = b; sendBtn.disabled = b;
  sendBtn.textContent = b ? "توقف" : "ارسال";
  sendBtn.className = b ? "stop" : "";
  statusEl.textContent = b ? "در حال پردازش..." : "آماده";
  inputEl.disabled = b;
}

async function parseSSE(response, onEvent) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "";
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf("\n\n")) !== -1) {
      const chunk = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      for (const line of chunk.split("\n")) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") { onEvent({ done: true }); continue; }
        try { onEvent(JSON.parse(payload)); } catch (e) {}
      }
    }
  }
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  inputEl.value = "";
  addMessage("user", text);
  chatHistory.push({ role: "user", content: text });

  const assistantEl = addMessage("assistant", "");
  assistantEl.textContent = "";
  let currentThink = null;
  let contentText = "";

  setBusy(true);
  controller = new AbortController();

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        model: "ministral",
        messages: [
          { role: "system", content: "You are a Claude-level autonomous agent. Investigate and use tools without asking." },
          ...chatHistory.slice(-20),
        ],
        stream: true,
        reasoning_effort: "medium",
      }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    await parseSSE(res, (ev) => {
      if (ev.done) return;
      const delta = ev.choices && ev.choices[0] && ev.choices[0].delta;
      if (!delta) return;
      if (delta.reasoning_content) {
        if (!currentThink) { currentThink = addThink(""); assistantEl.appendChild(currentThink); }
        currentThink.textContent += delta.reasoning_content;
      }
      if (delta.tool_call) {
        currentThink = null;
        assistantEl.appendChild(addTool(delta.tool_call.name || "?", delta.tool_call.arguments || {}));
      }
      if (delta.content) {
        currentThink = null;
        contentText += delta.content;
        assistantEl.textContent = contentText;
      }
      chatEl.scrollTop = chatEl.scrollHeight;
    });
    chatHistory.push({ role: "assistant", content: contentText || "(بدون پاسخ متنی)" });
  } catch (e) {
    if (e.name === "AbortError") assistantEl.textContent = contentText + "\n\n⏹️ متوقف شد.";
    else assistantEl.textContent = contentText + "\n\n❌ خطا: " + e.message;
  } finally {
    setBusy(false); controller = null;
  }
}

sendBtn.addEventListener("click", () => {
  if (busy && controller) { controller.abort(); return; }
  send();
});
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!busy) send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
});
fetch("/health").then(r => r.json()).then(d => {
  statusEl.textContent = d.sandbox ? "🛡️ Sandbox فعال" : "⚠️ Sandbox غیرفعال";
}).catch(() => { statusEl.textContent = "آفلاین"; });
</script>
</body>
</html>
